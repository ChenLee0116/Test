name: .NET Core Build and Run

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          # 這裡我們不寫死固定版本，讓它自動使用虛擬機內建最新的 .NET 10 SDK（從您的日誌中看到的）
          dotnet-version: '10.x'

      # 💡 關鍵修正：直接指定剛才日誌裡確認的精準路徑（注意：前面不用加 Test/，因為專案就在根目錄層級）
      - name: Restore dependencies
        run: dotnet restore RazorPagesHelloWorld/RazorPagesHelloWorld.csproj

      # 💡 關鍵修正：同樣直接指定該專案進行編譯
      - name: Compile project
        run: dotnet build RazorPagesHelloWorld/RazorPagesHelloWorld.csproj --configuration Release --no-restore
